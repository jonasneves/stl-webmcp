<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14161c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%A7%8A%3C/text%3E%3C/svg%3E">
  <title>stl-webmcp</title>
  <!-- Makes this page's WebMCP tools reachable from Claude, Cursor and VS Code through the author's MCP relay (relay.kandue.app); connects only when the visitor presses "Use in Claude". -->
  <script src="https://relay.kandue.app/webmcp.js"></script>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="cad.css">
</head>
<body>
  <div class="main-column">
    <div class="hud hud-left">
      <button id="panel-toggle-left" class="edge-toggle" type="button"
        aria-expanded="true" aria-controls="editor-pane" title="Toggle script panel" aria-label="Toggle script panel">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <defs><clipPath id="clip-toggle-left-hud"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.25"/></clipPath></defs>
          <rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.25" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2.75" y="3.75" width="5.75" height="12.5" fill="currentColor" clip-path="url(#clip-toggle-left-hud)"/>
        </svg>
      </button>
      <!-- The wordmark is the app menu's trigger, not a bare link home — the
           `../` destination it used to carry survives as one item inside.
           Disclosure pattern (aria-expanded + aria-controls), deliberately
           NOT role="menu": that role promises roving-tabindex arrow-key
           navigation, which main.js doesn't implement; Tab walks the items
           instead, which is what the markup actually supports. -->
      <div class="app-menu-wrap">
        <button class="app-menu-btn" id="app-menu-btn" type="button"
          aria-haspopup="true" aria-expanded="false" aria-controls="app-menu">
          <span class="logo-accent">stl</span><span class="logo-base">-webmcp</span>
          <svg class="app-menu-caret" width="10" height="10" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 8L10 12.5L15 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="app-menu" id="app-menu" hidden>
          <div class="app-menu-meta">
            <span class="app-menu-meta-label">Engine</span>
            <!-- One line per pinned dep rather than a "·"-joined pair: at the
                 menu's 240px the joined string wrapped mid-version, which
                 defeats the tabular alignment it's set in. -->
            <span class="app-menu-meta-value">manifold-3d 3.5.1</span>
            <span class="app-menu-meta-value">three 0.183.2</span>
          </div>
          <button class="app-menu-item" id="menu-api" type="button">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M8 3.5C6.5 3.5 6.5 5 6.5 6.5C6.5 8 5.5 10 4 10C5.5 10 6.5 12 6.5 13.5C6.5 15 6.5 16.5 8 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 3.5C13.5 3.5 13.5 5 13.5 6.5C13.5 8 14.5 10 16 10C14.5 10 13.5 12 13.5 13.5C13.5 15 13.5 16.5 12 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Script API
          </button>
          <a class="app-menu-item" href="https://github.com/jonasneves/stl-webmcp" target="_blank" rel="noopener">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M11 4H16V9M16 4L9.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 12V16H4V5H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Source on GitHub
          </a>
          <a class="app-menu-item" href="../">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.25" stroke="currentColor" stroke-width="1.5"/>
              <rect x="11" y="3.5" width="5.5" height="5.5" rx="1.25" stroke="currentColor" stroke-width="1.5"/>
              <rect x="3.5" y="11" width="5.5" height="5.5" rx="1.25" stroke="currentColor" stroke-width="1.5"/>
              <rect x="11" y="11" width="5.5" height="5.5" rx="1.25" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            All projects
          </a>
          <button class="app-menu-item destructive" id="menu-clear-history" type="button">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 6H16M8 6V4.5H12V6M6.2 6L7 16.5H13L13.8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Clear script history
            <span class="app-menu-count" id="menu-history-count"></span>
          </button>
        </div>
      </div>
    </div>

    <main>
      <section class="viewport-pane">
        <div class="viewport-toolbar">
          <!-- #vp-wireframe's icon is a cad.css ::before background-image, not an
               inline <svg>, unlike its four siblings below: main.js reassigns this
               button's textContent on every click (to flip the "on"/"off" word),
               which would wipe out a real DOM child every time — a pseudo-element
               isn't a child, so it survives. -->
          <button id="vp-wireframe" aria-pressed="false">Wireframe: off</button>
          <button id="vp-grid" class="on" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 3L7.5 17M12.5 3L12.5 17M3 7.5L17 7.5M3 12.5L17 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Grid
          </button>
          <button id="vp-reset" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 1L10 4M10 16L10 19M1 10L4 10M16 10L19 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Reset view
          </button>
          <span class="vp-sep"></span>
          <button id="vp-open" title="Load an STL — usable as imported() in scripts if it's a valid manifold, view-only otherwise">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 7V4H16V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 18V7.5M6.5 11L10 7.5L13.5 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Import&#8230;
          </button>
          <input id="vp-file" type="file" accept=".stl" hidden>
          <span class="vp-sep"></span>
          <button id="vp-export" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 13V16H16V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 2V18M6.5 14.5L10 18L13.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Export STL
          </button>
        </div>
        <canvas id="gl"></canvas>
        <div id="vp-empty" class="vp-empty">No shape yet — write a script and hit Run, or ask a WebMCP-aware agent to build one.</div>
        <div id="vp-report" class="vp-report" hidden></div>
      </section>
    </main>
  </div>

  <aside class="editor-pane" id="editor-pane" data-open="true">
    <div class="editor-toolbar">
      <span class="editor-title">Script</span>
      <select id="editor-history" class="editor-history" aria-label="Script history">
        <option value="">History&#8230;</option>
      </select>
      <button id="editor-run" class="btn-run">Run <kbd>&#8984;&#9166;</kbd></button>
    </div>
    <textarea id="editor" class="editor-text" spellcheck="false" autocomplete="off" autocapitalize="off"
      aria-label="CSG script"></textarea>
    <div id="editor-status" class="editor-status" role="status"></div>
  </aside>

  <div class="drop-indicator" id="drop-indicator" hidden aria-hidden="true">
    <div class="drop-indicator-label">Drop STL to import</div>
  </div>

  <!-- Reference sheet for the CSG DSL, opened from the app menu. No
       method="dialog" form and no backdrop-click close: dialogs dismiss by
       their own control or Escape only (AGENTS.md § UI/UX principles) — native <dialog>
       already provides the Escape half. -->
  <dialog id="api-dialog" aria-labelledby="api-dialog-title">
    <div class="api-dialog-head">
      <p class="dialog-title" id="api-dialog-title">Script API</p>
      <button type="button" class="api-dialog-close" id="api-dialog-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5.5 5.5L14.5 14.5M14.5 5.5L5.5 14.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <pre class="api-dialog-body" id="api-dialog-body" tabindex="0"></pre>
  </dialog>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
